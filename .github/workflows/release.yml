#
# Builds the plugin on a version tag and stages a DRAFT GitHub Release with the
# unsigned zip and its .sha256 file:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# CI never publishes. From here (RELEASING.md): optionally sign, replacing the
# draft's zip AND its .sha256 with the signed ones, and publish by hand.
#
# The tag must match the version in all five files that carry it, oie.json's
# engine range must be the engine plugin.xml names, and a tag whose release is
# already published is refused, so re-running this workflow can never replace a
# published release's files with an unsigned build.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # required to create the GitHub Release
  actions: read          # to find the tagged commit's Build run

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Refuse a tag whose release is already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if DRAFT="$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>&1)"; then
            if [ "$DRAFT" != "true" ]; then
              echo "::error::Release ${GITHUB_REF_NAME} is already published. Its files are never replaced; release a new version."
              exit 1
            fi
            echo "A draft exists for ${GITHUB_REF_NAME}; it will be updated."
          elif [ "$DRAFT" = "release not found" ]; then
            echo "No release exists for ${GITHUB_REF_NAME} yet."
          else
            # Anything else (network, permissions) must not be taken for "no release".
            echo "::error::Could not check for an existing release: $DRAFT"
            exit 1
          fi

      # Only a commit whose Build run on main passed, e2e jobs included, becomes a release. A tag
      # pushed right after the merge waits for that run (tags don't start one of their own).
      - name: Wait for the tagged commit's Build run to pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 120); do
            RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?head_sha=${GITHUB_SHA}&event=push&branch=main" \
              --jq '.workflow_runs[0] | select(. != null) | "\(.status) \(.conclusion) \(.html_url)"')"
            if [ -z "$RUN" ]; then
              if [ "$i" -ge 10 ]; then
                echo "::error::No Build run on main for ${GITHUB_SHA}. Tag a commit on main whose Build run passed."
                exit 1
              fi
              echo "No Build run on main for ${GITHUB_SHA} yet; waiting."
            else
              read -r STATUS CONCLUSION URL <<< "$RUN"
              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  echo "Build passed for ${GITHUB_SHA}: ${URL}"
                  exit 0
                fi
                echo "::error::The Build run for ${GITHUB_SHA} finished as '${CONCLUSION}': ${URL}"
                exit 1
              fi
              echo "The Build run for ${GITHUB_SHA} is ${STATUS}; waiting. ${URL}"
            fi
            sleep 30
          done
          echo "::error::The Build run for ${GITHUB_SHA} did not finish within 60 minutes."
          exit 1

      - name: Check the tag against every version file
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          HELP=org.apache.maven.plugins:maven-help-plugin:3.5.1
          check() {
            if [ "$2" != "$VERSION" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} is version ${VERSION}, but $1 says '$2'."
              FAILED=1
            fi
          }
          FAILED=0
          check "pom.xml <revision>" "$(mvn -q -N "$HELP:evaluate" -Dexpression=revision -DforceStdout)"
          check "oie.json version" "$(jq -r .version oie.json)"
          check "package/webadmin/plugin.json version" "$(jq -r .version package/webadmin/plugin.json)"
          check "package/webadmin/package.json version" "$(jq -r .version package/webadmin/package.json)"
          check "package/webadmin/package-lock.json version" "$(jq -r .version package/webadmin/package-lock.json)"
          check "package/webadmin/package-lock.json packages[\"\"].version" \
            "$(jq -r '.packages[""].version' package/webadmin/package-lock.json)"
          # The engine loads a plugin only on the exact version in plugin.xml's mirthVersion (the
          # pom's plugin.supported.mc.versions), so the store listing must say exactly that version too.
          ENGINE="$(mvn -q -N "$HELP:evaluate" -Dexpression=plugin.supported.mc.versions -DforceStdout)"
          for field in minEngineVersion maxEngineVersion; do
            got="$(jq -r ".$field" oie.json)"
            if [ "$got" != "$ENGINE" ]; then
              echo "::error::oie.json $field is '${got}', but the plugin is built for OIE ${ENGINE} (pom.xml plugin.supported.mc.versions), the only version the engine will load it on."
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "Set the version in every file listed above (RELEASING.md, step 2) and tag again."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "mc_version=$(mvn -q -N "$HELP:evaluate" -Dexpression=mc.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Cache OIE distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .oie-dist
          key: oie-dist-${{ steps.ver.outputs.mc_version }}

      # The script local builds use: it checks the distribution against the SHA-256
      # in the POM and installs the four engine jars.
      - name: Install engine jars into the local Maven repo
        env:
          OIE_DIST_CACHE: ${{ github.workspace }}/.oie-dist
        run: ./scripts/install-engine-jars.sh

      - name: Build and test
        run: mvn -B -ntp clean package

      # A green build with zero tests run proves nothing (see build.yml).
      - name: Confirm tests actually ran
        run: |
          reports=$(find . -path '*/target/surefire-reports/*.xml' | wc -l)
          if [ "$reports" -eq 0 ]; then
            echo "::error::No surefire reports were produced: the test suite did not run."
            exit 1
          fi
          echo "surefire report files: $reports"

      - name: Stage the release asset and checksum
        id: pkg
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          ASSET="oie-log-viewer-${VERSION}.zip"
          if [ ! -f "package/target/${ASSET}" ]; then
            echo "::error::package/target/${ASSET} was not built"; ls -l package/target || true; exit 1
          fi
          mkdir -p out
          cp "package/target/${ASSET}" "out/${ASSET}"
          ( cd out && sha256sum "${ASSET}" > "${ASSET}.sha256" )
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"

      - name: Create DRAFT GitHub Release with assets
        # Stays a draft: the zip is unsigned. A human signs it if wanted, replaces the
        # zip and its .sha256, and publishes. Pinned to v2.6.2 by commit.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          draft: true
          files: |
            out/${{ steps.pkg.outputs.asset }}
            out/${{ steps.pkg.outputs.asset }}.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
